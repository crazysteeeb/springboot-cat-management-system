<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add/Edit Cat</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 th:text="${cat.id} == null ? 'Add Cat' : 'Edit Cat'"></h2>

    <form th:action="@{/AddEditItems}" th:object="${cat}" method="post" class="mt-4">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Breed</label>
            <input type="text" th:field="*{breed}" class="form-control" autofocus required>
        </div>

        <div class="mb-3">
            <label class="form-label">Color Pattern</label>
            <input type="text" th:field="*{colorPattern}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Eye Color</label>
            <input type="text" th:field="*{eyeColor}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Fur Length</label>
            <input type="text" th:field="*{furLength}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Personality Type</label>
            <input type="text" th:field="*{personalityType}" class="form-control">
        </div>

        <button type="submit" class="btn btn-success">Save</button>

        <a href="/" class="btn btn-secondary ms-2">Cancel</a>

    </form>

</div>

</body>
</html>
