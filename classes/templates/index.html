<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cats</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- Heading -->
    <h1 class="mb-4 text-center">Cat Database</h1>

    <!-- Add Button -->
    <div class="mb-3">
        <a class="btn btn-primary"
           href="/AddEditItems"
        >
            <i class="fa-solid fa-cat"></i> Add Cat
        </a>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Breed</th>
            <th>Color Pattern</th>
            <th>Eye Color</th>
            <th>Fur Length</th>
            <th>Personality</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <!-- If no data exists -->
        <tr th:if="${#lists.isEmpty(catsList)}">
            <td colspan="7" class="text-center">No Data Found</td>
        </tr>

        <!-- If data exists -->
        <tr th:each="cat : ${catsList}">
            <td th:text="${cat.id}"></td>
            <td th:text="${cat.breed}"></td>
            <td th:text="${cat.colorPattern}"></td>
            <td th:text="${cat.eyeColor}"></td>
            <td th:text="${cat.furLength}"></td>
            <td th:text="${cat.personalityType}"></td>

            <td>
                <a th:href="@{/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">
                    <i class="fa-solid fa-pen"></i>
                </a>

                <a th:href="@{/delete/{id}(id=${cat.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure?');">
                    <i class="fa-solid fa-trash"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
